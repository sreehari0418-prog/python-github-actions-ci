name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - stage
  pull_request:
    branches:
      - main
      - develop
      - stage

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: 1. Build Image
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'pull_request' && github.base_ref == 'develop' || github.event_name == 'push' && github.ref_name == 'develop') && 'development' || (github.event_name == 'pull_request' && github.base_ref == 'main' || github.event_name == 'push' && github.ref_name == 'main') && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-ci:${{ github.sha }} .

      - name: Save image
        run: docker save python-ci:${{ github.sha }} -o python-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-image
          path: python-image.tar
          retention-days: 3

  scan:
    name: 2. Scan with Trivy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ (github.event_name == 'pull_request' && github.base_ref == 'develop' || github.event_name == 'push' && github.ref_name == 'develop') && 'development' || (github.event_name == 'pull_request' && github.base_ref == 'main' || github.event_name == 'push' && github.ref_name == 'main') && 'production' || 'staging' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-image

      - name: Load image
        run: docker load -i python-image.tar

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Generate Trivy report
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            python-ci:${{ github.sha }} > trivy-report.txt 2>&1 || true
          echo "--- Trivy scan complete ---"
          cat trivy-report.txt

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 7

      - name: Post Trivy report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('trivy-report.txt', 'utf8').trim();
            const summary = report.length > 0 ? report : 'No HIGH or CRITICAL vulnerabilities found.';
            const body = [
              '## Trivy Vulnerability Scan Report',
              '',
              `> **Branch:** \`${{ github.head_ref }}\` -> \`${{ github.base_ref }}\``,
              `> **Commit:** \`${{ github.sha }}\``,
              `> **Severity filter:** HIGH, CRITICAL (ignore-unfixed)`,
              '',
              '<details>',
              '<summary>Click to expand full scan report</summary>',
              '',
              '```',
              summary,
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Trivy Vulnerability Scan Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Trivy scan gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: python-ci:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: 3. Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [build, scan]
    environment:
      name: ${{ (github.event_name == 'pull_request' && github.base_ref == 'develop' || github.event_name == 'push' && github.ref_name == 'develop') && 'development' || (github.event_name == 'pull_request' && github.base_ref == 'main' || github.event_name == 'push' && github.ref_name == 'main') && 'production' || 'staging' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-image

      - name: Load image
        run: docker load -i python-image.tar

      - name: Docker Hub login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          docker tag python-ci:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.ref_name }}-${{ github.sha }}
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.ref_name }}-${{ github.sha }}

      - name: PR validation notice
        if: github.event_name == 'pull_request'
        run: echo "PR build and scan passed; Docker Hub publish skipped for PRs."