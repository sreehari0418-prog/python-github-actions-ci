name: Development CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: 1. Build Image
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-ci:${{ github.sha }} .

      - name: Save image
        run: docker save python-ci:${{ github.sha }} -o python-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-image
          path: python-image.tar
          retention-days: 3

  scan:
    name: 2. Scan with Trivy
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-image

      - name: Load image
        run: docker load -i python-image.tar

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: python-ci:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: 3. Artifact and Docker Hub
    runs-on: ubuntu-latest
    needs: [build, scan]
    environment: development

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-image

      - name: Load image
        run: docker load -i python-image.tar

      - name: Docker Hub login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag image
        if: github.event_name == 'push'
        run: |
          docker tag python-ci:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:develop-${{ github.sha }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:develop-${{ github.sha }}

      - name: PR validation
        if: github.event_name == 'pull_request'
        run: echo "Development PR build and scan passed; publishing skipped."
