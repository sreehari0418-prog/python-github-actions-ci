name: Staging CI/CD

on:
  push:
    branches:
      - stage

permissions:
  contents: read

jobs:
  build:
    name: 1. Build Image
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-ci:${{ github.sha }} .

      - name: Save image
        run: docker save python-ci:${{ github.sha }} -o python-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-image
          path: python-image.tar
          retention-days: 3

  scan:
    name: 2. Scan with Trivy
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-image

      - name: Load image
        run: docker load -i python-image.tar

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: python-ci:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: 3. Artifact and Docker Hub
    runs-on: ubuntu-latest
    needs: [build, scan]
    environment: staging

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-image

      - name: Load image
        run: docker load -i python-image.tar

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag image
        run: |
          docker tag python-ci:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:stage-${{ github.sha }}

      - name: Push image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:stage-${{ github.sha }}
